name: Ars Harmonia - APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Générer le projet Android React Native
        run: |
          npx react-native@0.74.5 init ArsHarmonia --version 0.74.5

      - name: Installer notre application
        run: |
          cp scr/App.jsx ArsHarmonia/App.js

      - name: Compiler l'APK
        working-directory: ArsHarmonia/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Préparer l'APK
        run: |
          cp ArsHarmonia/android/app/build/outputs/apk/debug/app-debug.apk Ars-Harmonia-V1.apk

      - name: Créer la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Ars Harmonia V1
          body: |
            Première version test d'Ars Harmonia.
          files: Ars-Harmonia-V1.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
